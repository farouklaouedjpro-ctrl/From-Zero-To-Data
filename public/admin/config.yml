backend:
  name: github
  repo: farouklaouedjpro-ctrl/From-Zero-To-Data
  branch: main
  base_url: https://decap-oauth.netlify.app

media_folder: "public/media"
public_folder: "/media"

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "articles"
    label: "Articles"
    folder: "content/articles"
    create: true
    slug: "{{slug}}"
    path: "{{slug}}"
    media_folder: ""
    public_folder: ""
    file: ""
    fields:
      - label: "Titre"
        name: "title"
        widget: "string"
      - label: "Slug"
        name: "slug"
        widget: "string"
        pattern:
          - "^[a-z0-9-]+$"
          - "Uniquement des lettres minuscules, chiffres et tirets"
      - label: "Extrait"
        name: "excerpt"
        widget: "text"
      - label: "Catégorie"
        name: "category"
        widget: "select"
        options:
          - "Intelligence Artificielle"
          - "Data Engineering"
          - "Analytics"
          - "Outils"
      - label: "Date"
        name: "date"
        widget: "string"
        hint: "Format : 11 août 2026"
      - label: "Temps de lecture"
        name: "readingTime"
        widget: "string"
        hint: "Ex : 12 min"
      - label: "Image de couverture"
        name: "cover"
        widget: "image"
        media_library:
          config:
            max_file_size: 5120000
      - label: "Corps de l'article"
        name: "body"
        widget: "markdown"
